<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZERO日本語・日本留学 - 工作台</title>
    <!-- 引入 Supabase 官方 SDK -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --primary-orange: #e67e22;
            --primary-orange-light: #fdf6ec;
            --bg-color: #fcf8f2;
            --card-bg: #ffffff;
            --text-main: #2c3e50;
            --text-muted: #7f8c8d;
            --border-color: #f3e5d8;
            --holiday-bg: #f1f2f6;
            --holiday-text: #a4b0be;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            padding: 24px;
            max-width: 1600px;
            margin: 0 auto;
        }

        header {
            margin-bottom: 24px;
            padding-bottom: 16px;
            border-bottom: 2px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
        }

        h1 {
            font-size: 24px;
            color: var(--primary-orange);
            font-weight: 700;
        }

        .header-right {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
        }

        .sync-badge {
            font-size: 13px;
            background: #ecfdf5;
            color: #059669;
            padding: 6px 14px;
            border-radius: 20px;
            font-weight: 600;
            border: 1px solid #a7f3d0;
        }

        .timezone-badge {
            font-size: 13px;
            background: #fae5d3;
            color: var(--primary-orange);
            padding: 6px 14px;
            border-radius: 20px;
            font-weight: 600;
        }

        .grid-container {
            display: grid;
            grid-template-columns: 1fr;
            gap: 24px;
        }

        .card {
            background: var(--card-bg);
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.03);
            border: 1px solid var(--border-color);
        }

        .card-title {
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            gap: 8px;
            color: var(--primary-orange);
        }

        /* 板块 1：倒计时样式 */
        .countdown-form {
            display: flex;
            gap: 12px;
            margin-bottom: 16px;
            flex-wrap: wrap;
            align-items: center;
            background: #fffcf7;
            padding: 14px;
            border-radius: 8px;
            border: 1px dashed #fabe8a;
        }

        .countdown-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 16px;
        }

        .countdown-item {
            background: #fffcf7;
            padding: 16px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            position: relative;
        }

        .countdown-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
        }

        .countdown-item h3 {
            font-size: 15px;
            color: var(--text-main);
            font-weight: 600;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            padding-right: 8px;
        }

        .countdown-target-time {
            font-size: 12px;
            color: var(--text-muted);
            margin-bottom: 10px;
        }

        .timer-display {
            font-size: 18px;
            font-weight: 700;
            color: var(--primary-orange);
            text-align: center;
            padding: 8px 0;
            background: #ffffff;
            border-radius: 6px;
            border: 1px dashed var(--primary-orange);
        }

        .countdown-del-btn {
            color: #ef4444;
            cursor: pointer;
            font-weight: bold;
            font-size: 14px;
            padding: 2px 6px;
            border-radius: 4px;
            background: #fee2e2;
            border: none;
        }

        .countdown-del-btn:hover {
            background: #fca5a5;
        }

        input[type="datetime-local"], input[type="text"], input[type="number"], input[type="date"], input[type="color"], select {
            padding: 8px 12px;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            font-size: 14px;
            outline: none;
            background: #fff;
        }

        input[type="color"] {
            padding: 2px 4px;
            width: 44px;
            height: 38px;
            cursor: pointer;
        }

        input:focus, select:focus {
            border-color: var(--primary-orange);
        }

        button {
            background: var(--primary-orange);
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 500;
            transition: opacity 0.2s;
            white-space: nowrap;
        }

        button:hover {
            opacity: 0.9;
        }

        .btn-secondary {
            background: #7f8c8d;
        }

        .btn-secondary:disabled {
            background: #bdc3c7;
            cursor: not-allowed;
            opacity: 0.6;
        }

        .btn-replan {
            background: #0284c7;
        }

        .btn-replan:hover {
            background: #0369a1;
        }

        .btn-rescue {
            background: #e11d48;
            font-size: 13px;
            padding: 6px 12px;
            font-weight: 700;
        }

        .btn-backup {
            background: #475569;
            font-size: 13px;
            padding: 6px 12px;
        }

        /* 工具栏与里程碑样式 */
        .panel-box {
            background: #fffaf0;
            border: 1px solid #fabe8a;
            border-radius: 8px;
            padding: 16px;
            margin-bottom: 16px;
        }

        .panel-row {
            display: flex;
            gap: 12px;
            align-items: center;
            flex-wrap: wrap;
        }

        .panel-row label {
            font-size: 14px;
            font-weight: 600;
        }

        .weekday-checkboxes {
            display: flex;
            gap: 10px;
            background: #fff;
            padding: 6px 12px;
            border-radius: 6px;
            border: 1px solid var(--border-color);
        }

        .weekday-checkboxes label {
            font-size: 13px;
            font-weight: normal;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .tag-list {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            margin-top: 10px;
        }

        .tag-item {
            background: #ffeaa7;
            color: #d35400;
            padding: 4px 10px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .tag-item span {
            cursor: pointer;
            color: #e74c3c;
        }

        .class-badge {
            padding: 5px 12px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 8px;
            border: 1px solid rgba(0,0,0,0.1);
        }

        .class-action-btn {
            cursor: pointer;
            font-size: 11px;
            padding: 2px 6px;
            border-radius: 4px;
            background: rgba(0,0,0,0.15);
            transition: background 0.15s;
        }

        .class-action-btn:hover {
            background: rgba(0,0,0,0.3);
        }

        .milestone-summary-box {
            background: #f0fdf4;
            border: 1px solid #bbf7d0;
            border-radius: 8px;
            padding: 14px 16px;
            margin-bottom: 16px;
        }

        .milestone-summary-title {
            font-size: 15px;
            font-weight: 700;
            color: #166534;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .milestone-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 10px;
        }

        .milestone-card {
            background: #ffffff;
            border: 1px solid #dcfce7;
            border-left: 4px solid #16a34a;
            padding: 8px 12px;
            border-radius: 6px;
            font-size: 13px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .milestone-card.type-开班 { border-left-color: #16a34a; }
        .milestone-card.type-半期 { border-left-color: #eab308; }
        .milestone-card.type-结课 { border-left-color: #dc2626; }

        .milestone-tag-badge {
            font-weight: 700;
            padding: 2px 6px;
            border-radius: 4px;
            font-size: 11px;
            color: #fff;
        }

        .badge-开班 { background: #16a34a; }
        .badge-半期 { background: #eab308; }
        .badge-结课 { background: #dc2626; }

        .milestone-del-btn {
            color: #ef4444;
            cursor: pointer;
            font-weight: bold;
            margin-left: 6px;
        }

        .inline-badge-icon {
            display: inline-flex;
            align-items: center;
            font-size: 10px;
            font-weight: 700;
            padding: 1px 4px;
            border-radius: 4px;
            color: #fff;
            margin-left: 4px;
            line-height: 1.2;
            vertical-align: middle;
            box-shadow: 0 1px 2px rgba(0,0,0,0.15);
        }

        /* 月历与双教室样式 */
        .month-control-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
            flex-wrap: wrap;
            gap: 10px;
        }

        .month-picker-group {
            display: flex;
            gap: 8px;
            align-items: center;
        }

        .rooms-twin-container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 24px;
        }

        @media (max-width: 1300px) {
            .rooms-twin-container {
                grid-template-columns: 1fr;
            }
        }

        .room-box {
            background: #fff;
            border-radius: 8px;
            border: 2px solid var(--primary-orange);
            overflow: hidden;
        }

        .room-header {
            background: var(--primary-orange);
            color: white;
            padding: 10px;
            font-size: 20px;
            font-weight: 700;
            text-align: center;
        }

        .calendar-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 12px;
            text-align: center;
            table-layout: fixed;
        }

        .calendar-table th, .calendar-table td {
            border: 1px solid var(--border-color);
            padding: 4px;
        }

        .calendar-table th {
            background: #fdf3e7;
            color: #d35400;
            font-weight: 600;
            height: 36px;
        }

        .calendar-table th.weekend {
            background: #fae5d3;
            color: #c0392b;
        }

        .day-cell {
            height: 96px;
            vertical-align: top;
            background: #fff;
        }

        .day-cell.other-month {
            background: #fafafa;
            opacity: 0.4;
        }

        .day-cell.is-holiday {
            background: var(--holiday-bg);
        }

        .day-number {
            font-weight: 700;
            font-size: 12px;
            text-align: left;
            margin-bottom: 3px;
            color: var(--text-main);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .holiday-label {
            font-size: 10px;
            color: #e74c3c;
            background: #fadbd8;
            padding: 1px 4px;
            border-radius: 3px;
        }

        .period-slot {
            font-size: 11px;
            padding: 3px 5px;
            margin-bottom: 2px;
            border-radius: 4px;
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            cursor: pointer;
            text-align: left;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .period-slot:hover {
            border-color: var(--primary-orange);
        }

        .period-slot.occupied {
            font-weight: 600;
            border: 1px solid rgba(0,0,0,0.15);
        }

        .period-slot.disabled {
            background: #e2e8f0;
            color: #94a3b8;
            cursor: not-allowed;
            border-color: #cbd5e1;
        }

        /* 板块 3：商品样式 */
        .product-form {
            display: flex;
            gap: 12px;
            margin-bottom: 16px;
        }

        .product-list {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 12px;
        }

        .product-card {
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #fffcf7;
        }

        .product-name {
            font-weight: 600;
            font-size: 14px;
        }

        .product-price {
            color: #27ae60;
            font-weight: 700;
            font-size: 15px;
        }

        .delete-btn {
            background: #e74c3c;
            padding: 4px 8px;
            font-size: 12px;
        }

        /* 弹窗样式 */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.4);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .modal-content {
            background: white;
            padding: 20px;
            border-radius: 8px;
            width: 380px;
        }

        .quick-milestone-box {
            margin-top: 14px;
            padding-top: 12px;
            border-top: 1px dashed var(--border-color);
        }

        .quick-milestone-box p {
            font-size: 12px;
            font-weight: 600;
            color: #4b5563;
            margin-bottom: 8px;
        }

        .quick-btn-group {
            display: flex;
            gap: 6px;
        }

        .quick-btn-group button {
            flex: 1;
            font-size: 12px;
            padding: 6px 0;
        }

        .modal-actions {
            display: flex;
            justify-content: flex-end;
            gap: 8px;
            margin-top: 16px;
        }
    </style>
</head>
<body>

    <header>
        <h1>ZERO日本語・日本留学 - 工作台</h1>
        <div class="header-right">
            <div class="sync-badge" id="sync-status">🟢 云端已连接</div>
            <button class="btn-rescue" onclick="deepScanAndRescue()">🚨 深度扫描并恢复所有历史数据</button>
            <button class="btn-backup" onclick="exportDataBackup()">📦 导出备份</button>
            <button class="btn-backup" onclick="document.getElementById('import-file-input').click()">📥 导入备份</button>
            <input type="file" id="import-file-input" style="display:none;" accept=".json" onchange="importDataBackup(event)">
            <div class="timezone-badge" id="bj-time">北京时间：加载中...</div>
        </div>
    </header>

    <div class="grid-container">

        <!-- 板块 1：倒计时 -->
        <div class="card">
            <div class="card-title">🌟 重要时间节点倒计时</div>
            <div class="countdown-form">
                <input type="text" id="new-countdown-name" placeholder="事件名称（例：JLPT 报名/考试/查成绩）" style="width: 260px;">
                <input type="datetime-local" id="new-countdown-time" style="width: 220px;">
                <button onclick="addCountdown()">+ 添加倒计时</button>
            </div>
            <div class="countdown-grid" id="countdown-list"></div>
        </div>

        <!-- 板块 2：全月网格排课 -->
        <div class="card">
            <div class="card-title">🌟 全月日历网格排课</div>

            <!-- 第一步：班级与颜色管理 -->
            <div class="panel-box" style="background: #f0fdf4; border-color: #86efac;">
                <div class="panel-row">
                    <label>🎨 1. 创建班级与设定专属颜色：</label>
                    <input type="text" id="class-name" placeholder="班级名称（例：N2冲刺班）" style="width: 200px;">
                    <label style="font-size: 13px; font-weight: normal;">班级颜色：</label>
                    <input type="color" id="class-color" value="#3b82f6">
                    <button onclick="addClass()" style="background: #10b981;">新建班级</button>
                </div>
                <div class="tag-list" id="class-tags"></div>
            </div>

            <!-- 里程碑节点面板 -->
            <div class="panel-box" style="background: #eff6ff; border-color: #93c5fd;">
                <div class="panel-row">
                    <label>🚩 2. 标注班级里程碑节点：</label>
                    <select id="milestone-class-select" style="font-weight: 600; min-width: 150px;"></select>
                    <select id="milestone-type-select">
                        <option value="开班">🟢 开班</option>
                        <option value="半期">🟡 半期</option>
                        <option value="结课">🔴 结课</option>
                    </select>
                    <input type="date" id="milestone-date">
                    <button onclick="addMilestone()" style="background: #2563eb;">标记节点</button>
                </div>
            </div>

            <!-- 第二步：节假日设置面板 -->
            <div class="panel-box" style="background: #fff5f5; border-color: #feb2b2;">
                <div class="panel-row">
                    <label>🎉 3. 设置不排课节假日：</label>
                    <input type="date" id="holiday-start">
                    <span>至</span>
                    <input type="date" id="holiday-end" placeholder="可选（单天可不填）">
                    <input type="text" id="holiday-name" placeholder="节假日名称（如：国庆节）" style="width: 160px;">
                    <button onclick="addHoliday()" style="background: #e74c3c;">添加节假日</button>
                </div>
                <div class="tag-list" id="holiday-tags"></div>
            </div>

            <!-- 第三步：批量排课 -->
            <div class="panel-box">
                <div class="panel-row" style="margin-bottom: 10px;">
                    <label>⚡️ 4. 批量排课 / 调整某班排课时间与次数：</label>
                    <select id="batch-class-select" style="font-weight: 600; color: var(--primary-orange); min-width: 160px;"></select>
                    <span>开始日期：</span>
                    <input type="date" id="batch-start">
                    <span>每周：</span>
                    <div class="weekday-checkboxes">
                        <label><input type="checkbox" name="batch-week" value="1">一</label>
                        <label><input type="checkbox" name="batch-week" value="2">二</label>
                        <label><input type="checkbox" name="batch-week" value="3">三</label>
                        <label><input type="checkbox" name="batch-week" value="4">四</label>
                        <label><input type="checkbox" name="batch-week" value="5">五</label>
                        <label><input type="checkbox" name="batch-week" value="6">六</label>
                        <label><input type="checkbox" name="batch-week" value="0">日</label>
                    </div>
                </div>
                <div class="panel-row">
                    <select id="batch-period">
                        <option value="上午">上午</option>
                        <option value="下午">下午</option>
                        <option value="晚上">晚上</option>
                    </select>
                    <select id="batch-room">
                        <option value="A">教室 A</option>
                        <option value="B">教室 B</option>
                    </select>
                    <input type="number" id="batch-count" placeholder="总课次数（如 22）" style="width: 140px;" min="1">
                    <span>次课</span>
                    <button onclick="batchBookWeekly(false)">一键智能追加排课</button>
                    <button class="btn-replan" onclick="batchBookWeekly(true)" title="清空该班原有的排课，并按最新设置的时间、周几和次数重新覆盖排课">🔄 重新规划/覆盖该班排课</button>
                    <button id="undo-btn" class="btn-secondary" onclick="undoLastBatch()" disabled title="仅可撤销上一次排课/清空操作">↩️ 撤销上一次操作</button>
                </div>
            </div>

            <!-- 里程碑节点提醒 -->
            <div class="milestone-summary-box">
                <div class="milestone-summary-title">
                    <span>🚩 课程里程碑节点提醒（整理汇总）</span>
                </div>
                <div class="milestone-grid" id="milestone-summary-list"></div>
            </div>

            <div class="month-control-bar">
                <div class="month-picker-group">
                    <label style="font-size: 14px; font-weight: 600;">当前查看月份：</label>
                    <select id="year-select" onchange="renderCalendars()"></select>
                    <select id="month-select" onchange="renderCalendars()"></select>
                    <button onclick="goCurrentMonth()" style="background: #7f8c8d;">当月</button>
                </div>
                <div id="data-stats-hint" style="font-size: 13px; color: var(--primary-orange); font-weight: 600;"></div>
            </div>

            <!-- A/B 教室并列 -->
            <div class="rooms-twin-container">
                <div class="room-box">
                    <div class="room-header">A 教室</div>
                    <table class="calendar-table" id="table-roomA"></table>
                </div>
                <div class="room-box">
                    <div class="room-header">B 教室</div>
                    <table class="calendar-table" id="table-roomB"></table>
                </div>
            </div>
        </div>

        <!-- 板块 3：学校课程商品 -->
        <div class="card">
            <div class="card-title">🌟 学校课程商品管理</div>
            <div class="product-form">
                <input type="text" id="prod-name" placeholder="课程商品名称（例：N2全科备考班）" style="width: 260px;">
                <input type="number" id="prod-price" placeholder="价格 (元)" style="width: 140px;">
                <button onclick="addProduct()">添加课程商品</button>
            </div>
            <div class="product-list" id="product-list"></div>
        </div>

    </div>

    <!-- 弹窗 -->
    <div class="modal" id="course-modal">
        <div class="modal-content">
            <h3 style="margin-bottom: 8px;">编辑/修改课程占用</h3>
            <p id="modal-time-title" style="font-size: 13px; color: var(--text-muted); margin-bottom: 12px;"></p>
            <select id="modal-class-select" style="width: 100%; margin-bottom: 12px;"></select>
            
            <div class="quick-milestone-box" id="quick-milestone-area">
                <p>🚩 将此日期（<span id="modal-date-display"></span>）直接标注为：</p>
                <div class="quick-btn-group">

        function formatDateStr(d) {
            let year = d.getFullYear();
            let month = (d.getMonth() + 1).toString().padStart(2, '0');
            let date = d.getDate().toString().padStart(2, '0');
            return `${year}-${month}-${date}`;
        }

        function getContrastYIQ(hexcolor){
            if(!hexcolor || hexcolor.charAt(0) !== '#') return 'black';
            hexcolor = hexcolor.replace("#", "");
            if(hexcolor.length === 3) {
                hexcolor = hexcolor.split('').map(c => c + c).join('');
            }
            var r = parseInt(hexcolor.substr(0,2),16);
            var g = parseInt(hexcolor.substr(2,2),16);
            var b = parseInt(hexcolor.substr(4,2),16);
            var yiq = ((r*299)+(g*587)+(b*114))/1000;
            return (yiq >= 128) ? '#2c3e50' : '#ffffff';
        }

        function updateAllTimers() {

                const target = new Date(c.targetTime).getTime();
                const diff = target - now;

                if (diff > 0) {
                    const days = Math.floor(diff / (1000 * 60 * 60 * 24));
                    const hours = Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
                    const mins = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
                    const secs = Math.floor((diff % (1000 * 60)) / 1000);
                    el.innerText = `${days}天 ${hours}时 ${mins}分 ${secs}秒`;

                    el.innerText = "已截止 / 已开始";
                }
            });
        }

        function batchBookWeekly(isOverwrite = false) {
            const className = document.getElementById('batch-class-select').value;
            const startStr = document.getElementById('batch-start').value;
            const period = document.getElementById('batch-period').value;
            const room = document.getElementById('batch-room').value;
            const count = parseInt(document.getElementById('batch-count').value);

            const checkedWeeks = Array.from(document.querySelectorAll('input[name="batch-week"]:checked')).map(cb => parseInt(cb.value));

            if (!className) { alert('请先选择要排课的班级！'); return; }
            if (!startStr) { alert('请选择开始日期！'); return; }
            if (checkedWeeks.length === 0) { alert('请至少勾选一个每周上课的星期！'); return; }
            if (!count || count <= 0) { alert('请填写有效的总课次数！'); return; }

            if (isOverwrite) {
                if (!confirm(`⚠️ 确定要重新规划【${className}】的排课吗？`)) return;
            }

            let curr = new Date(startStr);
            let simulatedSlots = [];
            let conflictDetails = [];
            let skippedDates = [];

            let tempSchedule = JSON.parse(JSON.stringify(scheduleData));
            if (isOverwrite) {
                Object.keys(tempSchedule).forEach(key => {
                    if (tempSchedule[key] === className) delete tempSchedule[key];
                });
            }

            while (simulatedSlots.length < count) {
                let dayOfWeek = curr.getDay(); 
                if (checkedWeeks.includes(dayOfWeek)) {
                    let dateKey = formatDateStr(curr);
                    if (holidays[dateKey]) {
                        skippedDates.push(`${dateKey}(${holidays[dateKey]})`);
                    } else {
                        let slotKey = `${room}_${dateKey}_${period}`;
                        if (tempSchedule[slotKey] && tempSchedule[slotKey] !== className) {
                            conflictDetails.push(`• ${dateKey} ${period}：已被【${tempSchedule[slotKey]}】占用`);
                        }
                        simulatedSlots.push(slotKey);
                    }
                }
                curr.setDate(curr.getDate() + 1);
            }

            if (conflictDetails.length > 0) {
                let warningMsg = `⚠️ 排课冲突警告！在 教室 ${room} 发现以下 ${conflictDetails.length} 处时间冲突：\n\n` +
                                 conflictDetails.slice(0, 10).join('\n') + 
                                 (conflictDetails.length > 10 ? `\n...等共 ${conflictDetails.length} 处冲突` : '') +
                                 `\n\n请选择：\n【确定】强行覆盖已有课程\n【取消】放弃排课并手动调整`;
                
                if (!confirm(warningMsg)) return;
            }

            previousScheduleBackup = JSON.parse(JSON.stringify(scheduleData));
            document.getElementById('undo-btn').disabled = false;

            if (isOverwrite) {
                Object.keys(scheduleData).forEach(key => {
                    if (scheduleData[key] === className) {
                        delete scheduleData[key];
                    }
                });
            }

            simulatedSlots.forEach(slotKey => {
                scheduleData[slotKey] = className;
            });

            syncToCloud();
            let actionText = isOverwrite ? "重新规划完成" : "排课成功";
            let msg = `${actionText}！已为【${className}】在 教室 ${room} 顺利排入 ${count} 次课。`;
            if (conflictDetails.length > 0) msg += `\n（已按指令覆盖冲突排课）`;
            if (skippedDates.length > 0) msg += `\n期间自动跳过 ${skippedDates.length} 天节假日。`;
            alert(msg);
            renderMilestones();
            renderCalendars();
        }

        function undoLastBatch() {
            if (!previousScheduleBackup) return;

            if (confirm('确认要撤销上一次的操作吗？课表将恢复到操作前。')) {
                scheduleData = JSON.parse(JSON.stringify(previousScheduleBackup));
                syncToCloud();
                previousScheduleBackup = null;
                document.getElementById('undo-btn').disabled = true;
                alert('已成功撤销上一次操作！');
                renderMilestones();
                renderCalendars();
            }
        }

        function initMonthPicker() {
            const yearSelect = document.getElementById('year-select');
            const monthSelect = document.getElementById('month-select');
            const now = new Date();

            let targetYear = now.getFullYear();
            let targetMonth = now.getMonth() + 1;

            let dates = Object.keys(scheduleData).map(k => k.split('_')[1]).filter(Boolean);
            if (dates.length > 0) {
                dates.sort();
                let [y, m] = dates[0].split('-');
                targetYear = parseInt(y);
                targetMonth = parseInt(m);
            }

            yearSelect.innerHTML = '';
            monthSelect.innerHTML = '';

            for(let y = now.getFullYear() - 1; y <= now.getFullYear() + 2; y++) {
                let opt = document.createElement('option');
                opt.value = y; opt.innerText = y + '年';
                if(y === targetYear) opt.selected = true;
                yearSelect.appendChild(opt);
            }

            for(let m = 1; m <= 12; m++) {
                let opt = document.createElement('option');
                opt.value = m; opt.innerText = m + '月';
                if(m === targetMonth) opt.selected = true;
                monthSelect.appendChild(opt);
            }
        }

        function goCurrentMonth() {
            const now = new Date();
            document.getElementById('year-select').value = now.getFullYear();
            document.getElementById('month-select').value = now.getMonth() + 1;
            renderCalendars();
        }

        function renderCalendars() {
            const year = parseInt(document.getElementById('year-select').value);
            const month = parseInt(document.getElementById('month-select').value);
            
            let firstDayIndex = new Date(year, month - 1, 1).getDay();
            let startOffset = firstDayIndex === 0 ? 6 : firstDayIndex - 1;
            let daysInMonth = new Date(year, month, 0).getDate();

            let monthPrefix = `${year}-${month.toString().padStart(2, '0')}`;
            let currentMonthLessons = Object.keys(scheduleData).filter(k => k.includes(monthPrefix)).length;
            document.getElementById('data-stats-hint').innerText = `📊 本月已排课：${currentMonthLessons} 节 | 系统总排课：${Object.keys(scheduleData).length} 节`;

            let gridDays = [];
            for (let i = 0; i < startOffset; i++) {
                gridDays.push({ type: 'empty' });
            }
            for (let d = 1; d <= daysInMonth; d++) {
                let dateKey = `${year}-${month.toString().padStart(2, '0')}-${d.toString().padStart(2, '0')}`;
                gridDays.push({ type: 'day', dayNum: d, dateKey: dateKey, holidayName: holidays[dateKey] || null });
            }
            while (gridDays.length % 7 !== 0) {
                gridDays.push({ type: 'empty' });
            }

            const periods = ['上午', '下午', '晚上'];

            const badgeIconMap = {
                '开班': { icon: '🟢开', bg: '#16a34a' },
                '半期': { icon: '🟡半', bg: '#eab308' },
                '结课': { icon: '🔴结', bg: '#dc2626' }
            };

            ['A', 'B'].forEach(room => {
                const table = document.getElementById(`table-room${room}`);
                let html = `
                    <thead>
                        <tr>
                            <th>一</th><th>二</th><th>三</th><th>四</th><th>五</th>
                            <th class="weekend">六</th><th class="weekend">日</th>
                        </tr>
                    </thead>
                    <tbody>
                `;

                for (let i = 0; i < gridDays.length; i += 7) {
                    html += '<tr>';
                    for (let j = 0; j < 7; j++) {
                        let item = gridDays[i + j];
                        if (item.type === 'empty') {
                            html += '<td class="day-cell other-month"></td>';
                        } else {
                            let isHoliday = !!item.holidayName;

                            let dayMilestones = milestones.filter(m => {
                                if (m.dateKey !== item.dateKey) return false;
                                let roomsForClass = getRoomsForClass(m.className);
                                return roomsForClass.includes(room) || roomsForClass.length === 0;
                            });

                            html += `<td class="day-cell ${isHoliday ? 'is-holiday' : ''}">`;
                            html += `<div class="day-number">
                                        <span>${item.dayNum}</span>
                                        ${isHoliday ? `<span class="holiday-label">${item.holidayName}</span>` : ''}
                                     </div>`;

                            periods.forEach(p => {
                                let slotKey = `${room}_${item.dateKey}_${p}`;
                                let className = scheduleData[slotKey] || '';
                                let isOccupied = className !== '';

                                if (isHoliday) {
                                    html += `<div class="period-slot disabled"><span>${p}: 休息</span></div>`;
                                } else {
                                    let customStyle = '';
                                    let badgeHtml = '';

                                    if(isOccupied) {
                                        let targetClass = classes.find(c => c.name === className);
                                        if(targetClass) {
                                            let bg = targetClass.color;
                                            let textClr = getContrastYIQ(bg);
                                            customStyle = `style="background-color: ${bg}; color: ${textClr};"`;
                                        }

                                        let targetMilestone = dayMilestones.find(m => m.className === className);
                                        if (targetMilestone && badgeIconMap[targetMilestone.type]) {
                                            let bInfo = badgeIconMap[targetMilestone.type];
                                            badgeHtml = `<span class="inline-badge-icon" style="background:${bInfo.bg};" title="${targetMilestone.className} ${targetMilestone.type}">${bInfo.icon}</span>`;
                                        }
                                    }

                                    let titleText = isOccupied ? `${p}: ${className}` : `${p}: 空闲`;

                                    html += `<div class="period-slot ${isOccupied ? 'occupied' : ''}" ${customStyle}
                                                  onclick="openModal('${slotKey}', '${className}', '${item.dateKey}', '教室 ${room} | ${item.dateKey} ${p}')">
                                                  <span style="overflow:hidden; text-overflow:ellipsis;">${titleText}</span>
                                                  ${badgeHtml}
                                               </div>`;
                                }
                            });

                            html += `</td>`;
                        }
                    }
                    html += '</tr>';
                }

                html += '</tbody>';
                table.innerHTML = html;
            });
        }

        function openModal(key, className, dateKey, title) {
            activeCellKey = key;
            activeDateKey = dateKey;
            
            document.getElementById('modal-time-title').innerText = title;
            document.getElementById('modal-class-select').value = className;
            document.getElementById('modal-date-display').innerText = dateKey;

            const quickArea = document.getElementById('quick-milestone-area');
            if (className) {
                quickArea.style.display = 'block';
            } else {
                quickArea.style.display = 'none';
            }

            document.getElementById('course-modal').style.display = 'flex';
        }

        function closeModal() {
            document.getElementById('course-modal').style.display = 'none';
        }

        function quickMarkMilestone(type) {
            const className = document.getElementById('modal-class-select').value;
            if (!className) {
                alert('请先为此时段选择一个班级！');
                return;
            }

            saveMilestoneDirectly(className, type, activeDateKey);
            alert(`已将 ${activeDateKey} 设为【${className}】的【${type}】节点！`);
            closeModal();
        }

        function saveSingleSlot() {
            const className = document.getElementById('modal-class-select').value;
            let oldClass = scheduleData[activeCellKey];

            if (oldClass && className && oldClass !== className) {
                if (!confirm(`⚠️ 该时段当前已被【${oldClass}】占用，确定要更改为【${className}】吗？`)) {
                    return;
                }
            }

            if(className) scheduleData[activeCellKey] = className;
            else delete scheduleData[activeCellKey];

            syncToCloud();
            closeModal();
            renderMilestones();
            renderCalendars();
        }

        function clearSingleSlot() {
            delete scheduleData[activeCellKey];
            syncToCloud();
            closeModal();
            renderMilestones();
            renderCalendars();
        }

        function renderProducts() {
            const container = document.getElementById('product-list');
            container.innerHTML = '';
            products.forEach((prod, index) => {
                let card = document.createElement('div');
                card.className = 'product-card';
                card.innerHTML = `
                    <div>
                        <div class="product-name">${prod.name}</div>
                        <div class="product-price">¥ ${prod.price}</div>
                    </div>
                    <button class="delete-btn" onclick="deleteProduct(${index})">删除</button>
                `;
                container.appendChild(card);
            });
        }

        function addProduct() {
            const nameInput = document.getElementById('prod-name');
            const priceInput = document.getElementById('prod-price');
            const name = nameInput.value.trim();
            const price = priceInput.value.trim();

            if (name && price) {
                products.push({ name, price });
                syncToCloud();
                nameInput.value = ''; priceInput.value = '';
                renderProducts();
            } else {
                alert('请填写完整的商品名称和价格！');
            }
        }

        function deleteProduct(index) {
            products.splice(index, 1);
            syncToCloud();
            renderProducts();
        }

        window.onload = function() {
            initMonthPicker();
            fetchFromCloud();
        };
    </script>
</body>
</html>
